:root{
  --bg:#F2F4F6;--card:#FFFFFF;--card2:#F2F4F6;--card3:#E5E8EB;--fg:#191F28;--sub:#4E5968;--muted:#8B95A1;--line:#E5E8EB;--bar:rgba(255,255,255,.82);
  --accent:#3182F6;--accent-bg:#E8F3FF;--accent-fg:#1B64DA;--on-accent:#FFFFFF;
  --red:#F04452;--red-bg:#FDECEE;--green:#02A262;--green-bg:#E3F6EE;--amber:#E58A00;--amber-bg:#FFF4DE;
  --teal:#0BA5A5;--teal-bg:#E0F6F6;--purple:#6B5CE7;--purple-bg:#EEEBFF;--orange:#F2731D;--orange-bg:#FFF0E5;--gray:#8B95A1;
  --g-living:#3182F6;--g-fixed:#8B7CF6;--g-irregular:#FF9F43;
  --r:16px;--tab-h:54px;--nav-h:48px;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#17171C;--card2:#202027;--card3:#2C2C35;--fg:#F2F3F5;--sub:#B0B8C1;--muted:#7E8792;--line:#2C2C35;--bar:rgba(23,23,28,.82);
  --accent:#4593FC;--accent-bg:#16263F;--accent-fg:#7DB4FF;--on-accent:#FFFFFF;
  --red:#FF6B6B;--red-bg:#3A1F24;--green:#2BD67B;--green-bg:#17301F;--amber:#FFB347;--amber-bg:#3A2E14;
  --teal:#2ED3C4;--teal-bg:#123330;--purple:#9B8BFF;--purple-bg:#272345;--orange:#FF9A57;--orange-bg:#3A2716;--gray:#7E8792;
  --g-living:#4593FC;--g-fixed:#9B8BFF;--g-irregular:#FFA95C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#17171C;--card2:#202027;--card3:#2C2C35;--fg:#F2F3F5;--sub:#B0B8C1;--muted:#7E8792;--line:#2C2C35;--bar:rgba(23,23,28,.82);
  --accent:#4593FC;--accent-bg:#16263F;--accent-fg:#7DB4FF;--on-accent:#FFFFFF;
  --red:#FF6B6B;--red-bg:#3A1F24;--green:#2BD67B;--green-bg:#17301F;--amber:#FFB347;--amber-bg:#3A2E14;
  --teal:#2ED3C4;--teal-bg:#123330;--purple:#9B8BFF;--purple-bg:#272345;--orange:#FF9A57;--orange-bg:#3A2716;--gray:#7E8792;
  --g-living:#4593FC;--g-fixed:#9B8BFF;--g-irregular:#FFA95C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,select,textarea{border:0;background:var(--card2);border-radius:12px;padding:13px 14px;width:100%;outline:none;min-width:0;font-size:16px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px var(--accent)}
input::placeholder{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
svg.i{width:22px;height:22px;flex:none}
.app{display:flex;flex-direction:column;height:100%}
/* 상단 내비게이션 바: 스크롤하면 작은 제목이 나타남 */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:var(--nav-h);
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));

/* 큰 캡처를 긴 변 1600px JPEG로 줄여 base64로 */
function imageToB64(file) {

    toast(r ? `${list.length}건 저장했어요. ${r}` : `${list.length}건 저장했어요`, 3200); } catch (e) { toast('저장하지 못했어요'); console.warn(e); }
  render();
}
/* 지갑에서 가게별 결제를 캡처로 넣으면, 은행 가져오기 때 만든 "○○에서 쓴 돈" 뭉텅이를 그만큼 줄인다 (중복 방지) */
async function absorbSettlements(list) {
  const msgs = [];
  for (const w of ['naver', 'kakao', 'pay']) {
    const caps = list.filter(t => t.a === w && t.t === '지출'); if (!caps.length) continue;
    let amt = caps.reduce((s_, t) => s_ + Number(t.v), 0); const from = addDays(caps.map(t => t.d).sort()[0], -10), to = addDays(caps.map(t => t.d).sort().pop(), 10);
    const lumps = allTx().filter(t => t.sw === w && t.d >= from && t.d <= to).sort((a, b) => (a.d < b.d ? -1 : 1)); const changed = []; const removed = [];
    for (const l of lumps) { if (amt <= 0) break; const take = Math.min(amt, Number(l.v)); amt -= take; const left = Number(l.v) - take; if (left > 0) { l.v = left; changed.push(l); } else removed.push(l); }
    if (changed.length) await saveTx(changed); for (const l of removed) await deleteTx(l);
    if (changed.length || removed.length) msgs.push(`${accName(w)}에서 쓴 돈을 가게별 내역으로 바꿨어요`);
  }
  return msgs.join(' ');
}
